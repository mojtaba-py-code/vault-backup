[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securesync"
version = "1.0.0"
description = "Secure, encrypted, deduplicating backup & restore tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]
dependencies = [
    "cryptography>=50.0.0",
    "argon2-cffi>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
securesync = "securesync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/securesync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.bandit]
# Tests deliberately exercise weak inputs and assert on failure paths.
exclude_dirs = ["tests"]
