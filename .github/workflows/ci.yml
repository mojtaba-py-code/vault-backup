name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # A dependency that was clean at merge time can be a known CVE a week later,
  # so re-run the pipeline (bandit, pip-audit) against a fresh advisory
  # database every Monday morning rather than waiting for the next commit.
  schedule:
    - cron: "0 6 * * 1"

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Type-check (mypy --strict)
        run: python -m mypy src
      # The floor sits below the current number on purpose: it catches a real
      # drop in tested code without failing on a line or two of platform-
      # specific code that only one leg of the matrix executes.
      - name: Tests
        run: >-
          python -m pytest -q --cov=securesync --cov-report=term-missing
          --cov-fail-under=80

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan below reads the history, not just the tip, so the
          # default single-commit checkout would leave it nothing to read.
          fetch-depth: 0

      # A backup tool that leaks a private key defeats its own purpose, so
      # every reachable commit is grepped for key blocks and provider tokens
      # before any other scan runs.  A credential committed on Monday and
      # deleted on Tuesday is still published, so the tip alone was never the
      # thing worth checking.  Deliberately dependency-free: no third-party
      # action, nothing to pin, nothing new to trust.
      # The character classes below (``[_]``, ``[A-Z ]*``) keep the patterns
      # from matching this file itself, so nothing has to be excluded: every
      # literal here runs into a ``[`` or a ``|`` at the point where a real
      # credential would continue, and neither can carry the match on.
      - name: Secret scan
        run: |
          # Recognisable key material, plus a long value assigned to a
          # secret-sounding name.  Matched case-insensitively, so an
          # upper-case API_KEY= in a dotenv file is caught as well.
          patterns='-----BEGIN [A-Z ]*PRIVATE KEY-----'
          patterns="$patterns"'|AKIA[0-9A-Z]{16}'
          # gh[pousr]_ covers the classic ghp_ token and the newer personal,
          # OAuth, user, server and refresh variants alike.
          patterns="$patterns"'|gh[pousr]_[A-Za-z0-9]{30,}'
          patterns="$patterns"'|github_pat_[A-Za-z0-9_]{30,}'
          patterns="$patterns"'|xox[abprs]-[0-9A-Za-z-]{10,}'
          patterns="$patterns"'|AIza[0-9A-Za-z_-]{35}'
          patterns="$patterns"'|sk-[A-Za-z0-9]{32,}'
          patterns="$patterns"'|"private[_]key"[[:space:]]*:'
          patterns="$patterns"'|(api[_-]?key|secret|token|passwd|password)[[:space:]]*[:=][[:space:]]*["]?[A-Za-z0-9/+_=-]{20,}'

          if git grep -nIEi -e "$patterns" \
            $(git rev-list --all); then
            echo "::error::possible secret committed to the repository"
            echo "Rotate it first: deleting the commit does not un-publish it."
            exit 1
          fi
          echo "No committed secrets found in $(git rev-list --count --all) commits."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          # setuptools is preinstalled on the runner and has had CVEs of its
          # own; pip-audit sees the whole environment, so upgrade it here
          # rather than let the runner's build tooling fail the audit.
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install bandit pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r src --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable --progress-spinner off
