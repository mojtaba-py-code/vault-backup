name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Type-check (mypy --strict)
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q --cov=securesync --cov-report=term-missing

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r src --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable --progress-spinner off
